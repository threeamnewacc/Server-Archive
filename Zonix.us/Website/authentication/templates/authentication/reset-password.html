{% extends "base/base.html" %}

{% load static %}

{% block title %}
    Forgotten Password
{% endblock %}

{% block page_content %}
    <div class="container">
        <div class="app row listed justify-content-center">
            <div class="col-md-6">
                <div class="table-wrapper">
                    <div class="table-header">
                        Reset Password
                    </div>
                    <div class="table-content">
                        <form class="form" id="reset-form">
                            <small class="text-muted">Choose a new password. Try not to forget it this time!</small>
                            <div class="alert" id="reset-response"></div>
                            <div class="form-group">
                                <label>New Password</label>
                                <input type="password" name="new_password" class="form-control" placeholder="New Password" autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label>New Password (Again)</label>
                                <input type="password" name="new_password_confirmation" class="form-control" placeholder="New Password" autocomplete="off">
                            </div>
                            <button type="submit" class="btn btn-primary">Change Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock page_content %}

{% block body_bottom %}
    <script type="text/javascript">
        setPageAttribute('reset_confirmation', '{{ context.reset_confirmation }}');
        setupResetPassword();
    </script>
{% endblock body_bottom %}
